name: productcam
description: "ProductCam — on-device background removal camera for product photos."
publish_to: 'none'

version: 0.1.0+1

# Toolchain is pinned deliberately (spec 001, research.md R1).
# The dev machine and CI must agree on this exact version.
environment:
  sdk: ^3.12.2
  flutter: ">=3.44.4"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Presentation state (Principle II — BLoC, no MVVM)
  flutter_bloc: 9.1.1
  equatable: 2.1.0

  # Composition root only (Principle I — never read outside it)
  get_it: 9.2.1

  # Declarative routing
  go_router: 17.5.0

  # Locale-aware formatting.
  # 0.20.2, not the newer 0.20.3: flutter_localizations in the pinned SDK
  # pins intl to exactly 0.20.2, and the SDK constraint wins.
  intl: 0.20.2

  # Just-in-time permissions (Principle VI)
  permission_handler: 13.0.1

  # Vector icons (spec 001b, research.md R2).
  # Chosen over an icon font so the design's 1.75 stroke is reproduced exactly
  # rather than baked in at whatever weight the font was generated with.
  flutter_svg: 2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  bloc_test: 10.0.0
  mocktail: 1.0.5

flutter:
  uses-material-design: true
  generate: true

  # `assets/fonts/` is deliberately NOT declared here. Font binaries reach the
  # bundle through the `fonts:` section below; declaring the directory as an
  # asset as well would ship every .ttf twice, and app size is a named top-three
  # risk on this project. Licence texts live in assets/licenses/ for that reason.
  assets:
    - assets/icons/
    - assets/licenses/

  # Six weights, not eight: an audit of the ten composed type roles found every
  # Manrope weight referenced but only one of the three IBM Plex Mono weights
  # (spec 001b, research R4). Mono 400 and 600 would be dead payload in every
  # install.
  #
  # Static TTF, not variable and not WOFF2. Flutter cannot load WOFF2 at all,
  # and variable-axis weight resolution would put unexplained churn into the
  # golden baselines this spec relies on (research R5).
  #
  # Each file is subset to Latin + Vietnamese. Latin-Extended is excluded
  # deliberately — it serves European languages this product does not ship.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-500.ttf
          weight: 500
