name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Golden baselines are regenerated here and nowhere else. The dev machine is
  # macOS, CI is Linux, and text rasterization differs enough between them that
  # one set of bytes cannot satisfy both — so CI is the single rendering target
  # (spec 001b research R6). Running --update-goldens locally would write
  # macOS-rendered bytes into a Linux-authoritative baseline set.
  workflow_dispatch:
    inputs:
      update_goldens:
        description: 'Regenerate golden baselines and commit them'
        type: boolean
        default: false

# The Flutter version is pinned to exactly what the dev machine uses.
# An action that silently tracks the latest stable would reintroduce the drift
# this pin exists to prevent (research.md R1).
env:
  FLUTTER_VERSION: '3.44.4'

jobs:
  verify:
    name: Format, analyze, guards, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Confirm the pinned toolchain
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Format
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      # Principles VII and IX — no hardcoded colours, styles or user-facing text.
      - name: No hardcoded style or text
        run: ./scripts/check_no_hardcode.sh

      # Principle I / FR-003 — features must not import each other's internals.
      - name: No cross-feature imports
        run: ./scripts/check_no_cross_feature_imports.sh

      # FR-014 — a key missing from any locale is a defect, not a fallback.
      - name: No missing translations
        run: ./scripts/check_l10n.sh

      # Runs everything, goldens included. This job is the golden authority.
      - name: Test
        run: flutter test

  update-goldens:
    name: Regenerate golden baselines
    if: github.event_name == 'workflow_dispatch' && inputs.update_goldens
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Regenerate goldens
        run: flutter test --update-goldens --tags golden

      - name: Commit refreshed baselines
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- test/; then
            echo "No golden changes — nothing to commit."
            exit 0
          fi
          git add test/
          git commit -m 'chore: regenerate golden baselines on the CI renderer'
          git push

# Deliberately NOT built here: iOS and Android artifacts. Those need signing
# setup and are not required by any acceptance criterion in spec 001. Real-device
# builds stay manual, which the workflow in .claude/dev-workflow.md already
# mandates for native-touching specs.
